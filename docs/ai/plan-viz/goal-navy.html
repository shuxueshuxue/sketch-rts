const fitGoalPlanView=function fitGoalPlanView(sheet,preferredZoom){const view=sheet.querySelector(".goal-graph-viewport");const stage=sheet.querySelector(".goal-graph-stage");const canvas=sheet.querySelector(".goal-graph-canvas");if(!view||!stage||!canvas)return;const width=Number(stage.dataset.width),height=Number(stage.dataset.height);const zoom=preferredZoom??Math.max(.3,Math.min(1,(view.clientWidth-4)/width,(view.clientHeight-4)/height));stage.style.width=`${width*zoom}px`;stage.style.height=`${height*zoom}px`;stage.dataset.zoom=String(zoom);canvas.style.transform=`scale(${zoom})`;const money=sheet.querySelector(".goal-money-scroll.time-aligned");const chart=money?.querySelector(".goal-money-chart");if(money&&chart){chart.style.width=`${width*zoom}px`;money.style.width=`${view.clientWidth}px`;money.scrollLeft=view.scrollLeft;view.onscroll=()=>{money.scrollLeft=view.scrollLeft}}};

document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.planNode){selected=button.dataset.planNode;wide=false;render();panel.scrollTop=0;}else if(button.dataset.tick){range.value=button.dataset.tick;render();}else if(button.dataset.action==='goal-graph'){opened=!opened;render();}else{const action=button.dataset.action;if(action==='goal-time'||action==='goal-regression'){order=action==='goal-time'?'time':'regression';zoom=undefined;render();return;}if(action==='goal-wide'){wide=!wide;fit();return;}if(action==='goal-fit')zoom=undefined;else if(action==='goal-zoom-in'||action==='goal-zoom-out'){const old=Number(graph.querySelector('.goal-graph-stage')?.dataset.zoom??1);zoom=Math.max(.3,Math.min(2,old*(action==='goal-zoom-in'?1.25:.8)));}fit();}});
range.addEventListener('input',render);window.addEventListener('resize',fit);render();
</script></body></html>
