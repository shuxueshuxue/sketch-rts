name: CLI Check

on:
  pull_request:
    paths:
      - tools/cli/**
      - bin/sketch
      - package.json
      - package-lock.json
      - tsconfig.json
      - .github/workflows/cli-check.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx vitest run tools/cli
      - run: npx tsc -p tools/cli/tsconfig.json
