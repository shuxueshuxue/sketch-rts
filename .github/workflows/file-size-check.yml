name: File Size Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  sizes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/check-file-sizes.sh "origin/${{ github.base_ref }}" HEAD
