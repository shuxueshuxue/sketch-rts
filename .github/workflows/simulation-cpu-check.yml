name: Simulation CPU Check

on:
  pull_request:
    paths:
      - src/shared/**
      - src/ai/**
      - src/sdk/**
      - .github/workflows/simulation-cpu-check.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simulation-cpu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  duels:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SKETCH_RTS_BASE_PATH: /sketch-rts/
      VITE_SKETCH_RTS_BASE_PATH: /sketch-rts/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Test mining upkeep, cent settlement and presentation
        run: npx vitest run src/shared/mining-upkeep.test.ts src/shared/mining.test.ts src/shared/mining-waiting.test.ts src/shared/ship-training-cost.test.ts src/shared/unit-repair.test.ts src/shared/purchase.test.ts src/shared/savegame.test.ts src/shared/sim/determinism.test.ts src/shared/sim/restore.test.ts src/client/hud-model.test.ts src/client/net/lockstep-client.test.ts src/story/world.test.ts
      - name: Test balanced AI duels and CPU budgets
        run: npx vitest run src/shared/sim.test.ts --testNamePattern="runs a fast two-AI duel" --maxWorkers=1 --minWorkers=1
