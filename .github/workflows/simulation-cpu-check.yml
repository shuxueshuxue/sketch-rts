name: Simulation CPU Check

on:
  pull_request:
    paths:
      - docs/**
      - src/shared/**
      - src/ai/**
      - src/sdk/**
      - tools/ai/**
      - scripts/build-room-baseline.ts
      - scripts/verify-room-baseline.ts
      - scripts/ai-room-ab.ts
      - scripts/verify-room-ab-isolation.ts
      - scripts/verify-room-ab-position.ts
      - .github/workflows/simulation-cpu-check.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simulation-cpu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Fetch pinned room planner sources for manifest checks (no bundle build)
        run: git fetch --no-tags --depth=1 origin 646cf9a0513459d16e6b12007d4945148bb29651
      - name: Verify frozen room manifest and runtime import boundary without an artifact
        run: npx vitest run src/ai/frozen/room-baseline.test.ts --maxWorkers 1 --minWorkers 1
      - name: Typecheck frozen room build and parity tools
        run: npx tsc --noEmit -p tools/ai/tsconfig.json
      - name: Verify room A/B schedules and observational metrics (no artifact needed)
        run: npx vitest run src/ai/benchmark/room-ab.test.ts src/ai/benchmark/room-ab-metrics.test.ts src/ai/benchmark/room-ab-position.test.ts src/shared/sim/observation.test.ts --maxWorkers 1 --minWorkers 1
      - name: Verify output-only plan traces preserve command bytes and policy memory
        run: npx vitest run src/ai/plan-trace.test.ts src/ai/plan-trace-history.test.ts src/ai/plan-viz-ledger.test.ts src/ai/planner-context.test.ts --maxWorkers 1 --minWorkers 1
  duels:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SKETCH_RTS_BASE_PATH: /sketch-rts/
      VITE_SKETCH_RTS_BASE_PATH: /sketch-rts/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Test generated camp budgets and named map layouts
        run: npx vitest run src/shared/generated-camp-budget.test.ts src/shared/map-pool.test.ts
      - name: Verify guardian scroll reduction, presentation and rules boundaries
        run: npx vitest run src/shared/guardian-scroll.test.ts src/shared/shipbuilding.test.ts src/shared/sim/canonical.test.ts src/client/tooltips.test.ts src/client/status-presentation.test.ts src/client/guardian-scroll-visual.test.ts
      - name: Verify human feedback, guard stations and unchanged all-AI command replays
        run: npx vitest run src/shared/sim/command-refusal-feedback.test.ts src/shared/sim/guard-position.test.ts src/shared/sim/ai-guard-compatibility.test.ts src/shared/sim/snapshot-unit-copy.test.ts src/shared/sim/restore.test.ts src/sdk/game-runner.test.ts src/client/net/lockstep-client.test.ts src/shared/player-aggro.test.ts src/shared/push.test.ts src/story/director.test.ts src/client/menu-forest-horde.test.ts src/client/menu-scenes.test.ts src/campaigns/ashen-march/campaign.test.ts
      - name: Verify ranged aim continuation and naval firing constraints
        run: npx vitest run src/shared/aiming-range-buffer.test.ts src/shared/aiming.test.ts src/shared/aiming-invalidation.test.ts src/shared/ship-fire-control.test.ts src/shared/ship-attack-station.test.ts src/shared/sim/canonical.test.ts src/story/director.test.ts
      - name: Verify passive naval room measurements and real crossings
        run: npx vitest run src/ai/benchmark/naval-metrics.test.ts src/ai/benchmark/naval-room.test.ts src/ai/benchmark/naval-loading-diagnostics.test.ts src/ai/benchmark/naval-obstacle-metrics.test.ts
      - name: Verify shipyard departures and frozen physical solids
        run: npx vitest run src/shared/ship-solid-planning.test.ts src/shared/ship-planning-state.test.ts
      - name: Verify first combat deliveries and repeated reinforcements
        run: npx vitest run src/ai/bootstrap_1/combat-delivery.test.ts src/ai/bootstrap_1/reinforcement-ferries.test.ts
      - name: Test release boundaries, mining upkeep and presentation
        run: npx vitest run src/sdk/package-boundaries.test.ts src/ai/bootstrap_1/summoner-composition.test.ts src/shared/mining-upkeep.test.ts src/shared/mining.test.ts src/shared/mining-waiting.test.ts src/shared/ship-training-cost.test.ts src/shared/unit-repair.test.ts src/shared/purchase.test.ts src/shared/savegame.test.ts src/shared/sim/determinism.test.ts src/shared/sim/restore.test.ts src/client/hud-model.test.ts src/client/net/lockstep-client.test.ts src/story/world.test.ts
      - name: Test empty-frame allocation and veteran transitions
        run: npx vitest run src/shared/sim/veteran-frame-gates.test.ts src/shared/veteran-integration.test.ts src/shared/veteran-runtime.test.ts src/shared/veteran-skills.test.ts src/shared/veteran-balance.test.ts src/shared/sim/veteran-command.test.ts src/shared/sim/command-frame-runtime.test.ts src/sdk/commands/frame.test.ts src/shared/sim/grounded-frame.test.ts src/shared/sim/grounded-combat-frame.test.ts src/shared/replay.test.ts src/shared/savegame.test.ts src/shared/sim/projectile-frame.test.ts src/shared/projectile-contact.test.ts src/shared/damage-integration.test.ts src/shared/sim/spatial-index.test.ts src/shared/sim/spatial-metadata-transfer.test.ts src/shared/sim/unit-separation.test.ts src/shared/ship-motion.test.ts src/shared/ship-collisions.test.ts src/shared/ship-cabin-movement-frame.test.ts src/shared/sim/team-spatial-index.test.ts
      - name: Test colony care, guardian coverage and ferry reuse
        run: npx vitest run src/ai/bootstrap_1/colony-recovery.test.ts src/ai/bootstrap_1/guardian-local-force.test.ts src/ai/bootstrap_1/ferry-return-summons.test.ts src/ai/bootstrap_1/ferry-departure.test.ts src/ai/bootstrap_1/landed-capital.test.ts

      - name: Test free island income and actual sea roads
        run: npx vitest run src/ai/bootstrap_1/fleet-free-mine.test.ts src/ai/policy/naval-mines.test.ts

      - name: Test continued area escape under pursuit
        run: npx vitest run src/ai/bootstrap_1/area-pursuit.test.ts
      - name: Verify recovery roads and reachable care endpoints
        run: npx vitest run src/shared/retreat-route.test.ts src/ai/bootstrap_1/recovery-road-coverage.test.ts src/ai/bootstrap_1/front-recovery.test.ts src/ai/bootstrap_1/recovery-cast-cover.test.ts src/ai/bootstrap_1/front-post-area.test.ts src/ai/bootstrap_1/lethal-item-care.test.ts

      - name: Verify bounded fronts and commanded movement
        run: npx vitest run src/shared/route-prefix.test.ts src/ai/bootstrap_1/front-road-prefix.test.ts src/shared/sim/unit-update.test.ts src/shared/ship-queued-course.test.ts src/ai/policy/spatial.test.ts src/ai/policy/nearest-query-order.test.ts src/ai/policy/skirmish-tactics.test.ts src/ai/policy/skirmish-retreat-memory.test.ts src/ai/policy/v5-ranged-core.test.ts src/ai/policy/humanized-combat.test.ts src/ai/policy/mechanical-healing.test.ts

      - name: Verify safe free mine capital and builder roads
        run: npx vitest run src/ai/bootstrap_1/free-expansion.test.ts src/ai/bootstrap_1/two-income-expansion.test.ts src/ai/bootstrap_1/expansion-road-threat.test.ts src/ai/bootstrap_1/economy.test.ts src/ai/policy/v6/economy.test.ts src/ai/bootstrap_1/long-haul-investment.test.ts

      - name: Verify camp reinforcements and unsupported caster micro
        run: npx vitest run src/ai/bootstrap_1/summoner-staging.test.ts src/ai/bootstrap_1/summoner-support-reach.test.ts src/ai/bootstrap_1/camp-recruit-road.test.ts src/ai/bootstrap_1/caster-melee-micro.test.ts src/ai/bootstrap_1/camp-assembly.test.ts src/ai/policy/v6/backline.test.ts src/ai/bootstrap_1/summoner-screen.test.ts src/ai/bootstrap_1/mounted-micro.test.ts

      - name: Verify assault camp detours and closed roads
        run: npx vitest run src/ai/bootstrap_1/assault-camp-roads.test.ts src/ai/bootstrap_1/assault-camp-blocked.test.ts src/ai/bootstrap_1/assault-cohesion.test.ts

      - name: Verify loot couriers recheck roads and preserve veteran return
        run: npx vitest run src/ai/bootstrap_1/loot-trip-reassessment.test.ts src/ai/bootstrap_1/loot-recovery.test.ts src/ai/bootstrap_1/recovery-road-coverage.test.ts

      - name: Verify research intent survives occupied labs
        run: npx vitest run src/ai/bootstrap_1/research-intent.test.ts src/ai/bootstrap_1/research-prerequisites.test.ts src/ai/bootstrap_1/economy.test.ts src/ai/policy/v6/economy.test.ts

      - name: Verify actual front exposure and disengagement
        run: npx vitest run src/ai/bootstrap_1/front-exposure.test.ts src/ai/policy/v6/general.test.ts src/ai/bootstrap_1/battle-roads.test.ts src/ai/bootstrap_1/covered-defense.test.ts src/ai/bootstrap_1/front-recovery.test.ts

      - name: Verify recruitment intents and shared producer budgets
        run: npx vitest run src/ai/bootstrap_1/recruitment-intent.test.ts src/ai/policy/v6/economy.test.ts src/ai/bootstrap_1/economy.test.ts src/ai/bootstrap_1/shopping.test.ts

      - name: Verify mounted escape and shooting intents
        run: npx vitest run src/ai/bootstrap_1/mounted-escape-intent.test.ts src/ai/bootstrap_1/mounted-charge.test.ts src/ai/bootstrap_1/mounted-spent-charge.test.ts src/ai/bootstrap_1/mounted-retreat-motion.test.ts src/ai/bootstrap_1/mounted-camp-preparation.test.ts

      - name: Verify executable assault targets and legacy commander
        run: npx vitest run src/ai/bootstrap_1/attack-target-eligibility.test.ts src/ai/policy/v6/general.test.ts src/ai/bootstrap_1/attack-reinforcements.test.ts




      - name: Verify research funding and retained first-medic reservation
        run: npx vitest run src/ai/bootstrap_1/ready-production-capital.test.ts src/ai/bootstrap_1/research-funding.test.ts src/ai/bootstrap_1/tech-first-medic.test.ts

      - name: Verify independent riders use admitted roads and parallel objectives
        run: npx vitest run src/ai/bootstrap_1/mounted-global-field.test.ts src/ai/bootstrap_1/threat-roads.test.ts src/ai/bootstrap_1/mounted-detour-recruitment.test.ts src/ai/bootstrap_1/mounted-road-admission.test.ts src/ai/bootstrap_1/mounted-ground-assignments.test.ts src/ai/bootstrap_1/mounted-raids.test.ts src/ai/bootstrap_1/mounted-recruitment.test.ts

      - name: Verify depleted mining transfers and retained boarding ownership
        run: npx vitest run src/ai/bootstrap_1/depleted-ferry-target.test.ts src/ai/bootstrap_1/ferry-preparation.test.ts src/ai/bootstrap_1/transport-recovery.test.ts src/ai/bootstrap_1/rider-crossing.test.ts

      - name: Verify landed riders retain zero-loss camp completion
        run: npx vitest run src/ai/bootstrap_1/mounted-expedition.test.ts --testNamePattern=v9_knight

      - name: Verify mobile patients and existing care ownership
        run: npx vitest run src/ai/bootstrap_1/mobile-care.test.ts src/ai/bootstrap_1/care-road-progress.test.ts src/ai/bootstrap_1/archer-task-scope.test.ts src/ai/bootstrap_1/mainland-medical-priority.test.ts src/ai/bootstrap_1/medical-roads.test.ts src/ai/bootstrap_1/medical-allocation.test.ts src/ai/bootstrap_1/front-post-continuity.test.ts src/ai/bootstrap_1/expedition-recovery.test.ts

      - name: Verify mercenary trip roads and retained purchasing ownership
        run: npx vitest run src/ai/bootstrap_1/island-mercenary-return.test.ts src/ai/bootstrap_1/mercenary-trip-roads.test.ts src/ai/bootstrap_1/mercenary-control.test.ts src/ai/bootstrap_1/mercenary-goals.test.ts src/ai/bootstrap_1/mercenary-retreat-ownership.test.ts

      - name: Verify coast targets have working gun stations and produce real hits
        run: npx vitest run src/shared/ship-attack-station.test.ts src/ai/bootstrap_1/fleet-coast-target.test.ts

      - name: Test balanced AI duels and CPU budgets
        run: npx vitest run src/shared/sim.test.ts --testNamePattern="runs a fast two-AI duel" --maxWorkers=1 --minWorkers=1

      - name: Verify small armies pay for existing counters
        run: npx vitest run src/ai/bootstrap_1/early-counter-production.test.ts src/ai/bootstrap_1/summoner-composition.test.ts src/ai/bootstrap_1/tech-first-medic.test.ts

      - name: Verify paid healing posts and actual resting-army availability
        run: npx vitest run src/ai/bootstrap_1/summoner-healing-post.test.ts src/ai/bootstrap_1/clinic-army-availability.test.ts src/ai/bootstrap_1/front-recovery.test.ts src/ai/policy/v8/well.test.ts

      - name: Verify summoned worker raids and retained permanent-host screen
        run: npx vitest run src/ai/bootstrap_1/summoned-raids.test.ts src/ai/bootstrap_1/tower-rush.test.ts src/ai/bootstrap_1/summoner-screen.test.ts src/ai/bootstrap_1/clinic-army-availability.test.ts

      - name: Verify ready free income before guarded mines
        run: npx vitest run src/ai/bootstrap_1/landed-colony-capital.test.ts src/ai/bootstrap_1/free-income-capital.test.ts src/ai/bootstrap_1/expansion-authority.test.ts src/ai/bootstrap_1/ready-free-mine.test.ts src/ai/bootstrap_1/free-expansion.test.ts src/ai/bootstrap_1/two-income-expansion.test.ts

      - name: Verify active mining jobs and transported worker credits
        run: npx vitest run src/ai/bootstrap_1/active-mining-jobs.test.ts src/ai/bootstrap_1/workforce.test.ts src/ai/bootstrap_1/transported-workforce.test.ts src/ai/bootstrap_1/island-workforce.test.ts

      - name: Verify funded expansion escort and retained construction cover
        run: npx vitest run src/ai/bootstrap_1/funded-expansion-escort.test.ts src/ai/bootstrap_1/mining-job-defense.test.ts src/ai/bootstrap_1/expansion-construction-escort.test.ts

      - name: Verify paid mounted field fights and retained camp and mining control
        run: npx vitest run src/ai/bootstrap_1/mounted-field-recruitment.test.ts src/ai/bootstrap_1/mounted-field.test.ts src/ai/bootstrap_1/archer-task-scope.test.ts src/ai/bootstrap_1/mine-defense.test.ts src/ai/bootstrap_1/front-recovery.test.ts
