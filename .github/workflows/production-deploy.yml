name: Production Deploy

on:
  push:
    branches: [main, production]
  workflow_dispatch:
    inputs:
      main_sha:
        description: Optional current main SHA. Leave empty to deploy latest main.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: sketch-rts-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SKETCH_RTS_BASE_PATH: /sketch-rts/
      VITE_SKETCH_RTS_BASE_PATH: /sketch-rts/
      ALIYUN_PORT: ${{ secrets.ALIYUN_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve production deployment revision
        env:
          MAIN_SHA: ${{ github.event.inputs.main_sha || '' }}
        run: bash scripts/resolve-production-revision.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Test mining, maps and selectable room AI
        run: npx vitest run src/shared/mining.test.ts src/shared/map-pool.test.ts src/ai/policy/mining.test.ts src/ai/policy/naval.test.ts src/ai/policy/naval-cover.test.ts src/ai/bootstrap_1/combined-arms.test.ts src/ai/bootstrap_1/weapon-targets.test.ts src/ai/bootstrap_1/attack-reinforcements.test.ts src/ai/bootstrap_1/mounted-micro.test.ts src/ai/bootstrap_1/mounted-approach.test.ts src/ai/bootstrap_1/mounted-raids.test.ts src/ai/bootstrap_1/mounted-charge.test.ts src/ai/bootstrap_1/mounted-items.test.ts src/ai/bootstrap_1/mounted-camp-preparation.test.ts src/ai/bootstrap_1/archer-micro.test.ts src/ai/bootstrap_1/shell-evasion.test.ts src/ai/bootstrap_1/bolt-evasion.test.ts src/ai/bootstrap_1/marching-evasion.test.ts src/ai/bootstrap_1/area-evasion.test.ts src/ai/bootstrap_1/worker-area-evasion.test.ts src/ai/bootstrap_1/mine-defense.test.ts src/ai/bootstrap_1/working-base-defense.test.ts src/ai/bootstrap_1/mining-assignments.test.ts src/ai/bootstrap_1/economy.test.ts src/ai/bootstrap_1/parallel-construction.test.ts src/ai/bootstrap_1/construction-workers.test.ts src/ai/bootstrap_1/construction-handoff.test.ts src/ai/bootstrap_1/expansion-camp.test.ts src/ai/bootstrap_1/tower-rush.test.ts src/ai/bootstrap_1/tower-host-facing.test.ts src/ai/bootstrap_1/home-front.test.ts src/ai/bootstrap_1/opening-front.test.ts src/ai/bootstrap_1/summoner-composition.test.ts src/ai/bootstrap_1/closeout-recruits.test.ts src/ai/policy/v6/closeout.test.ts src/ai/policy/v6/economy.test.ts src/shared/rooms.test.ts src/shared/room-schema.test.ts src/client/room-route.test.ts src/client/deployment/room-ai.test.ts src/ai/planner-context.test.ts src/ai/policy/script-runner.test.ts src/shared/mining-waiting.test.ts

      - name: Test research, recovery, regrouping and ordinary reinforcement commands
        run: npx vitest run src/ai/bootstrap_1/research-prerequisites.test.ts src/ai/bootstrap_1/recovery-budget.test.ts src/ai/bootstrap_1/first-recovery-purchase.test.ts src/ai/bootstrap_1/mounted-prepared-shot.test.ts src/ai/bootstrap_1/mounted-raid-pursuit.test.ts src/ai/bootstrap_1/mounted-spent-charge.test.ts src/ai/bootstrap_1/mounted-guarded-line.test.ts src/ai/bootstrap_1/tower-advance-screen.test.ts src/ai/bootstrap_1/expansion-authority.test.ts src/ai/bootstrap_1/mining-tower-cover.test.ts src/ai/bootstrap_1/mining-capital.test.ts src/ai/bootstrap_1/critical-mining-escort.test.ts src/ai/bootstrap_1/off-axis-front.test.ts src/ai/bootstrap_1/defensive-route.test.ts src/ai/bootstrap_1/regroup.test.ts src/ai/bootstrap_1/front-recovery.test.ts src/ai/policy/skirmish-retreat-memory.test.ts src/ai/policy/v6/general.test.ts

      - name: Test balanced AI duels and CPU budgets
        run: npx vitest run src/shared/sim.test.ts --testNamePattern="runs a fast two-AI duel" --maxWorkers=1 --minWorkers=1

      - name: Test release contracts and visual state
        run: npx vitest run scripts/production-deploy.test.ts scripts/production-revision.test.ts scripts/production-install.test.ts scripts/painted-sprite-bounds.test.ts scripts/hud-portrait-bounds.test.ts src/client/unit-animation.test.ts src/client/ability-icons.test.ts src/client/unit-hover-cursor.test.ts src/client/unit-hover-target.test.ts src/client/pointer-lock.test.ts src/client/room-setup-session.test.ts src/ai/policy/snapshot.test.ts src/ai/policy/spatial.test.ts src/shared/combat-capabilities.test.ts src/shared/ability-cooldowns.test.ts src/shared/sim/spatial-index.test.ts src/shared/veteran-skills.test.ts src/shared/veteran-runtime.test.ts src/shared/veteran-integration.test.ts src/shared/veteran-balance.test.ts src/shared/archer-balance.test.ts src/shared/sim/veteran-command.test.ts src/shared/ship-cabin.test.ts src/client/ability-effects.test.ts src/client/status-presentation.test.ts src/shared/corpses.test.ts src/shared/sim/restore.test.ts src/shared/snapshot-ground.test.ts src/sdk/game-runner.test.ts src/shared/construction-intent.test.ts src/shared/warfare.test.ts src/client/training-queue.test.ts src/client/menu-scenes.test.ts src/client/resources.test.ts src/client/resource-panel.test.ts src/client/world-presentation.test.ts src/client/portrait-cache.test.ts src/client/world3d src/client/selection-controls.test.ts src/client/sound-loading.test.ts

      - run: npm run build:production

      - name: Pack production artifact
        run: |
          set -euo pipefail
          tar -czf sketch-rts-production.tar.gz dist dist-server

      - name: Install SSH key
        env:
          ALIYUN_SSH_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          test -n "$ALIYUN_SSH_KEY" && test -n "$ALIYUN_HOST"
          printf '%s\n' "$ALIYUN_SSH_KEY" > ~/.ssh/sketch-rts-production
          chmod 600 ~/.ssh/sketch-rts-production
          ssh-keyscan -T 10 -p "$ALIYUN_PORT" "$ALIYUN_HOST" >> ~/.ssh/known_hosts

      - name: Upload artifact and deploy script
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
        run: |
          set -euo pipefail
          remote="$ALIYUN_USER@$ALIYUN_HOST"
          remote_dir="/tmp/sketch-rts-deploy-${DEPLOY_SHA}"
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/sketch-rts-production -p "$ALIYUN_PORT" "$remote" "rm -rf '$remote_dir' && mkdir -p '$remote_dir'"
          scp -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/sketch-rts-production -P "$ALIYUN_PORT" sketch-rts-production.tar.gz scripts/deploy-production.sh "$remote:$remote_dir/"
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/sketch-rts-production -p "$ALIYUN_PORT" "$remote" \
            "set +e; bash '$remote_dir/deploy-production.sh' '$remote_dir/sketch-rts-production.tar.gz' '$DEPLOY_SHA'; status=\$?; rm -rf '$remote_dir'; exit \$status"

      - name: Verify public game endpoint
        run: curl --fail --silent --show-error --retry 3 --max-time 30 https://lexicalmathical.com/sketch-rts/api/catalog --output /dev/null

      - name: Remove temporary SSH key
        if: always()
        run: rm -f ~/.ssh/sketch-rts-production

      - name: Publish GitHub production release package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: production-latest
          RELEASE_TITLE: Sketch RTS Production
        run: |
          set -euo pipefail
          git tag -f "$RELEASE_TAG" "$DEPLOY_SHA"
          git push --force origin "refs/tags/$RELEASE_TAG"
          release_notes="Production deployment for ${DEPLOY_SHA}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --yes
          fi
          gh release create "$RELEASE_TAG" sketch-rts-production.tar.gz --target "$DEPLOY_SHA" --title "$RELEASE_TITLE" --notes "$release_notes" --latest
