<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>船舶导航 · 实际仿真回放</title><style>
:root{font-family:Inter,"Noto Sans CJK SC",system-ui,sans-serif;color:#e8eaf0;background:#101820;color-scheme:dark;font-synthesis:none}*{box-sizing:border-box}body{margin:0}header{padding:22px 32px 18px;border-bottom:1px solid #ffffff16;display:flex;justify-content:space-between;gap:24px;align-items:center}h1{font-size:22px;font-weight:650;letter-spacing:.02em;margin:0 0 5px}.sub{color:#8a9aa9;font-size:12px}.badge{font-size:10px;letter-spacing:.16em;color:#68d9d0;text-transform:uppercase;margin-bottom:8px}.toolbar{padding:14px 32px;display:flex;gap:14px;align-items:center;background:#14212b;flex-wrap:wrap}select,button{font:inherit;font-size:12px;color:inherit;background:#20323f;border:1px solid #3a5161;border-radius:5px;padding:8px 12px}button{cursor:pointer}button:hover{background:#2d485b}select{max-width:360px}.grow{flex:1}label{font-size:12px;color:#a0b0bc}input[type=checkbox]{accent-color:#5ac7bc}main{padding:18px 32px 22px}.panels{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#13222b;border:1px solid #2c414e;border-radius:8px;overflow:hidden}.panel>header{padding:12px 16px;background:#1a2b36;font-size:13px}.panel small{color:#8da4b3;font-size:11px}.viewport{height:420px;position:relative}canvas{display:block;width:100%;height:100%}.info{position:absolute;top:12px;left:12px;border:1px solid #ffffff18;border-radius:4px;background:#11212bea;padding:8px 10px;font-size:11px;line-height:1.7;pointer-events:none;min-width:168px}.info strong{font-weight:550;color:#fff}.empty{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:#8a9ba9}.metrics{display:flex;gap:24px;padding:12px 16px;border-top:1px solid #ffffff12}.metric{font-size:10px;color:#8ca3b0}.metric b{display:block;color:#e1eaed;font-size:17px;font-weight:550;margin-bottom:3px}.timeline{display:flex;align-items:center;gap:14px;padding:16px 0}.time{font:500 14px ui-monospace,monospace;min-width:107px}.timeline input{flex:1;accent-color:#63d1c4}.charts{display:grid;grid-template-columns:1fr 1fr;gap:18px}.chart{height:160px;border:1px solid #2c414e;border-radius:6px;background:#14232c;position:relative}.chart-label{position:absolute;top:10px;left:14px;font-size:10px;letter-spacing:.04em;color:#9bb0bd}.notes{font-size:12px;line-height:1.8;color:#95abb8;display:flex;gap:30px;justify-content:space-between;padding-top:12px}.legend{display:flex;align-items:center;gap:16px;font-size:10px}.dot{display:inline-block;width:8px;height:8px;margin-right:5px;border-radius:50%;background:#60ded0}.enemy{background:#ee947e}.base{background:#e5a26d}.final{background:#69d9c9}.status{color:#edb890}.copyright{font-size:10px;color:#647e8e;margin-top:15px}#loading{padding:50px;text-align:center;color:#8ba7b7}@media(max-width:900px){.panels{grid-template-columns:1fr}.viewport{height:360px}.charts{grid-template-columns:1fr}header,main,.toolbar{padding-left:16px;padding-right:16px}}
</style><body><header><div><div class="badge">Navigation lab / actual simulation</div><h1>船舶导航 · 实际仿真回放</h1><div class="sub" id="description">同一初始条件、同一指令；船首、航迹和操舵均来自真实仿真采样。</div></div><div class="legend"><span><i class="dot base"></i>改前</span><span><i class="dot final"></i>改后</span><span><i class="dot enemy"></i>移动目标</span></div></header><div class="toolbar"><label>场景 <select id="scenario"></select></label><label>跟踪 <select id="unit"></select></label><span class="grow"></span><label><input type="checkbox" id="route" checked> 计划航路</label><label><input type="checkbox" id="trails" checked> 全部航迹</label><label><input type="checkbox" id="follow"> 跟随船舶</label><select id="rate"><option value="1">1× 实时</option><option value="2">2×</option><option value="4" selected>4×</option><option value="8">8×</option><option value="16">16×</option></select></div><main><div id="loading">正在加载采样…</div><div class="panels"><section class="panel"><header><span>改前 <small id="before-build"></small></span><small id="before-status"></small></header><div class="viewport"><canvas id="before"></canvas><div class="info" id="before-info"></div><div class="empty" id="before-empty" hidden>暂无采样</div></div><div class="metrics" title="汇总为场景观测船；上方可切换不同船舶的即时数值与曲线。" id="before-metrics"></div></section><section class="panel"><header><span>改后 <small id="after-build"></small></span><small id="after-status"></small></header><div class="viewport"><canvas id="after"></canvas><div class="info" id="after-info"></div><div class="empty" id="after-empty" hidden>新版采样尚未生成</div></div><div class="metrics" title="汇总为场景观测船；上方可切换不同船舶的即时数值与曲线。" id="after-metrics"></div></section></div><div class="timeline"><button id="play">▶ 播放</button><button id="restart">↺</button><input id="progress" type="range" min="0" max="100" step="0.05" value="0"><span class="time" id="time">0.0 / 0.0 s</span></div><div class="charts"><div class="chart"><div class="chart-label">航速 · WORLD UNITS / SECOND</div><canvas id="speed-chart"></canvas></div><div class="chart"><div class="chart-label">转向率 · DEG / SECOND</div><canvas id="turn-chart"></canvas></div></div><div class="notes"><span id="scenario-note"></span><span>虚线：计划航路 · 十字：当前目的地 · 白点：航迹时间标记</span></div><div class="copyright">20 Hz 确定性仿真 · 直接回放每个实际 tick · 拖动时间轴检查停滞、反复转舵与换舷</div></main><script src="review.js"></script></body></html>
